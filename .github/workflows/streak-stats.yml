name: Update streak stats

on:
  schedule:
    - cron: '0 3 * * *'
  push:
    branches: [main]
    paths:
      - .github/workflows/streak-stats.yml
  workflow_dispatch:

concurrency:
  group: streak-stats

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Generate streak stats
        uses: DenverCoder1/github-readme-streak-stats@v1
        with:
          options: user=Darwin-1106&background=135,070818,1e1040&border=6D5BD0&stroke=A78BFA&ring=61DAFB&fire=F472B6&currStreakNum=FFFFFF&sideNums=61DAFB&currStreakLabel=F472B6&sideLabels=E2E8F0&dates=A78BFA&border_radius=14&disable_animations=true
          path: profile/streak.svg

      - name: Validate SVG
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse('profile/streak.svg').getroot()
          assert root.tag == '{http://www.w3.org/2000/svg}svg', 'Expected an SVG image'
          PY

      - name: Save updated stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/streak.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: update streak stats"
          git pull --rebase origin main
          git push origin HEAD:main
